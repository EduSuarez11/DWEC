<div class="d-flex flex-row justify-content-start align-items-start gap-3" >
    <input class="form-check-input" type="checkbox" [id]="producto()._id" [value]="producto()._id" aria-label="..." (change)="isChecked.set($event.target.checked)" />
    <div [ngClass]="{ 'card mb-3': true, 'bg-success': isChecked() }" [ngStyle]="{ 'width': '100%', 'background-color': isChecked() ? '#3dd2ba' : 'transparent', 'border': isChecked() ? '1px solid #13c1ac' : 'none', 'padding': '10px', 'borderRadius': '5px' }">
        <div class="row g-0">
            <div class="col-1">
                <img [src]="producto().fotos[0].data" class="img-fluid rounded-start" style="width:80px; height:80px;" [alt]="`portada de ${producto().titulo}`" />
            </div>
            <div class="col-11">
                <div class="card-body">
                    <div class="d-flex flex-row justify-content-between align-items-center">
                        <div class="d-flex flex-column justify-content-start ">
                            <h5 class="card-title">{{ producto().precio }} €</h5>
                            <p class="card-text"><small class='text-body-secondary'>{{producto().titulo}}</small></p>
                        </div>
                        <div class="d-flex flex-column justify-content-start ">
                            <p class="card-text">Publicado</p>
                            <p class="card-text"><small class='text-body-secondary'>{{ producto().fechaPublicacion | date:'dd/MM/yyyy' }}</small></p>
                        </div>
                        <div class="d-flex flex-column justify-content-start ">
                            <p class="card-text">Modificado</p>
                            <p class="card-text"><small class='text-body-secondary'>{{ producto().fechaModificacion | date:'dd/MM/yyyy' }}</small></p>
                        </div>
                        <button class="btn btn-sm btn-dark" style="min-width: 80px; border-radius: 100px; font-size: 1rem">Destacalo</button>
                        <div class="d-flex flex-row justify-content-end ">
                            <button class="btn-icon" id="btn-icon-save"><i class="fa-regular fa-handshake"></i></button>
                            <button class="btn-icon" id="btn-icon-bookmark"><i class="fa-regular fa-bookmark"></i></button>
                            <button class="btn-icon" id="btn-icon-pencil"><i class="fa-solid fa-pencil"></i></button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>      
</div>
